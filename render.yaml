# ==============================================================================
# RENDER BLUEPRINT CONFIGURATION SPECIFICATION (render.yaml)
# Project: Institutional Meeting Tracker (Production Infrastructure)
# Backend: Node.js 20+ Express + Realtime WebSockets
# Database: Managed PostgreSQL (v16) with automated backups
# Reverse Proxy & Edge: Cloudflare DNS / SSL
# ==============================================================================

databases:
  # Managed PostgreSQL instance provisioned inside Render's private virtual network
  - name: meeting-tracker-db
    plan: starter # Options: free (spins down after inactivity), starter (recommended for persistent production), standard
    databaseName: meeting_tracker
    user: tracker_admin
    region: oregon # Choose the region closest to your institution (e.g. oregon, frankfurt, singapore)
    ipAllowList: [] # Empty list allows access ONLY from your Render services inside the private network

services:
  # Web Service running the Node.js API and WebSocket server
  - type: web
    name: meeting-tracker-api
    runtime: node
    plan: starter # Starter plan guarantees persistent runtime without sleep cycles for WebSocket connections
    region: oregon
    rootDir: server # Subdirectory containing package.json and server source code
    buildCommand: "npm install && npm run migrate && npm run seed"
    startCommand: "npm start"
    healthCheckPath: /api/v1/health # Render continuously monitors this endpoint to ensure zero-downtime deploys
    autoDeploy: true # Automatically deploy when new commits are pushed to the connected branch

    envVars:
      - key: NODE_ENV
        value: production

      # Reference to the internal database connection string generated by the managed PostgreSQL service
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-tracker-db
          property: connectionString

      # High-entropy JWT secret key automatically generated by Render on first setup
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 30d

      - key: BCRYPT_SALT_ROUNDS
        value: 10

      # CORS Origin: allow all client platforms (Windows desktop, Android app, web)
      - key: CORS_ORIGIN
        value: "*"

      # WebSocket heartbeat interval (30 seconds) to prevent Cloudflare edge timeout (100s default)
      - key: WS_HEARTBEAT_INTERVAL_MS
        value: 30000

      - key: DEFAULT_COMPLETION_RULE
        value: ModeA_Strict
