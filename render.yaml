# ==============================================================================
# RENDER BLUEPRINT CONFIGURATION SPECIFICATION (render.yaml)
# Project: Institutional Meeting Tracker (Production Infrastructure)
# Backend: Node.js 20+ Express + Realtime WebSockets
# Database: External PostgreSQL (Neon.tech Free Tier - Does not expire)
# Hosting: Render Free Web Service
# ==============================================================================

services:
  # Web Service running the Node.js API and WebSocket server
  - type: web
    name: meeting-tracker-api
    runtime: node
    plan: free # Free tier web service
    region: oregon
    rootDir: server # Subdirectory containing package.json and server source code
    buildCommand: "npm install && npm run migrate && npm run seed"
    startCommand: "npm start"
    healthCheckPath: /api/v1/health # Render monitors this endpoint to ensure healthy deploys
    autoDeploy: true # Automatically deploy when new commits are pushed

    envVars:
      - key: NODE_ENV
        value: production

      # Paste your Neon.tech PostgreSQL connection string here or enter it in Render prompt:
      # e.g., postgresql://username:password@ep-xyz.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # High-entropy JWT secret key automatically generated by Render on first setup
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 30d

      - key: BCRYPT_SALT_ROUNDS
        value: 10

      # CORS Origin: allow all client platforms (Windows desktop, Android app, web)
      - key: CORS_ORIGIN
        value: "*"

      # WebSocket heartbeat interval (30 seconds)
      - key: WS_HEARTBEAT_INTERVAL_MS
        value: 30000

      - key: DEFAULT_COMPLETION_RULE
        value: ModeA_Strict
